<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Przewodnik 20.08 — Anaga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  :root{
    --calima:#EDEAE0;   /* jasne tło — czytelne w słońcu */
    --lava:#1B1C1E;     /* tekst */
    --senal:#16509E;    /* niebieski jak hiszpańskie znaki drogowe */
    --blanco:#FFFFFF;
    --verde:#0E7A3D;    /* odsłuchane */
    --oro:#C9820E;      /* najbliższy przystanek */
    --mut:#6D6A61;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--calima);color:var(--lava);
       font-family:'Archivo',system-ui,sans-serif;font-size:16px;line-height:1.45;
       padding:12px 12px 60px}
  .plate{background:var(--senal);color:#fff;border:3px solid #fff;border-radius:16px;
         box-shadow:0 0 0 2px var(--senal),0 4px 14px rgba(27,28,30,.18);
         padding:16px 18px;margin:4px 0 14px}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
  h1{font-family:'Archivo Black',sans-serif;font-size:34px;line-height:1.02;margin:6px 0 2px}
  .plate small{opacity:.85}
  .card{background:var(--blanco);border-radius:14px;padding:12px 14px;margin:10px 0;
        box-shadow:0 1px 4px rgba(27,28,30,.10)}
  .controls{position:sticky;top:8px;z-index:20}
  .gps{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;min-height:22px}
  .dot{width:10px;height:10px;border-radius:50%;background:#B4B0A5;flex:none}
  .dot.on{background:var(--verde)} .dot.err{background:#B3261E}
  .gps small{font-weight:400;color:var(--mut)}
  .row{display:flex;gap:8px;margin-top:10px}
  button{font-family:inherit;font-size:16px;font-weight:700;border:0;border-radius:12px;
         min-height:52px;cursor:pointer}
  .row button{flex:1;background:var(--calima);color:var(--lava)}
  .row button:active{transform:scale(.98)}
  .row .prim{background:var(--senal);color:#fff}
  .pilot{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px;color:var(--mut)}
  .pilot input{width:22px;height:22px;accent-color:var(--senal)}
  #nextBtn{display:none;width:100%;margin-top:10px;background:var(--oro);color:#fff}
  .stop{border-left:6px solid transparent;transition:border-color .3s}
  .stop.near{border-left-color:var(--oro)}
  .stop.playing{border-left-color:var(--senal);box-shadow:0 0 0 2px var(--senal)}
  .stop.done{opacity:.62}
  .stop .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .stop h2{font-family:'Archivo Black',sans-serif;font-size:19px;margin:0}
  .stop .sub{color:var(--mut);font-size:13px;margin:2px 0 0}
  .dist{font-weight:700;font-size:14px;color:var(--senal);white-space:nowrap;flex:none}
  .state{font-size:12px;font-weight:700;margin-top:6px;min-height:14px}
  .state.play{color:var(--senal)} .state.done{color:var(--verde)} .state.q{color:var(--oro)}
  .mini{display:flex;gap:8px;margin-top:10px}
  .mini button{flex:1;min-height:46px;font-size:18px;background:var(--calima)}
  #overlay{position:fixed;inset:0;background:rgba(237,234,224,.97);z-index:50;
           display:flex;flex-direction:column;justify-content:center;padding:24px;text-align:center}
  #overlay .plate{text-align:left}
  #startBtn{background:var(--senal);color:#fff;font-size:22px;min-height:72px;width:100%;
            border:3px solid #fff;box-shadow:0 0 0 2px var(--senal)}
  #overlay p{color:var(--mut);font-size:14px}
  #warn{display:none;background:#B3261E;color:#fff;border-radius:12px;padding:10px 14px;
        font-size:14px;font-weight:600;margin:10px 0}
</style>
</head>
<body>

<div id="overlay">
  <div class="plate">
    <div class="eyebrow">Teneryfa · czwartek 20.08 · auto</div>
    <h1>Góry<br>Anaga</h1>
    <small>audioprzewodnik GPS · 13 przystanków</small>
  </div>
  <button id="startBtn">▶ &nbsp;Start przewodnika</button>
  <p>Po starcie zezwól na <b>lokalizację</b>, gdy Chrome zapyta.<br>
     Kierowca patrzy na drogę — telefon trzyma pilot.</p>
</div>

<div class="plate">
  <div class="eyebrow">Teneryfa · czwartek 20.08 · auto</div>
  <h1>Góry Anaga</h1>
  <small>narracja włącza się sama z GPS</small>
</div>

<div id="warn"></div>

<div class="card controls">
  <div class="gps"><span class="dot" id="gpsDot"></span><span id="gpsTxt">GPS: czekam na start…</span></div>
  <div class="row">
    <button id="pauseBtn">⏸ Pauza</button>
    <button id="replayBtn">↺ Powtórz</button>
    <button id="stopBtn">⏹ Stop</button>
  </div>
  <label class="pilot"><input type="checkbox" id="pilotChk">
    Tryb pilota — odtwarzaj ręcznie, po kolei (bez GPS)</label>
  <button id="nextBtn">▶ Następny przystanek</button>
</div>

<div id="stops"></div>

<script>
const STOPS=[
{id:"intro",t:"Powitanie",s:"gra po naciśnięciu startu",lat:null,lon:null,r:0,
 x:"Dzień dobry! Dziś jedziemy na północno-wschodni kraniec wyspy, w góry Anaga. Plan: najpierw spacer po La Lagunie, dawnej stolicy wyspy, potem wjazd na grzbiet do Cruz del Carmen i las wawrzynowy, punkt widokowy Pico del Inglés, zjazd serpentynami do Taganany, obiad w Casa África nad samym oceanem, a na koniec czarna dzika plaża Benijo. Kierowca patrzy na drogę, pilot trzyma telefon. Ruszamy!"},
{id:"laguna",t:"San Cristóbal de La Laguna",s:"pierwsza stolica, miasto z listy UNESCO",lat:28.4888946,lon:-16.3169879,r:1200,
 x:"Witajcie w La Lagunie, pierwszej stolicy Teneryfy. To miasto ma niezwykłą cechę: zostało zaprojektowane w prostą kratę ulic już około roku tysiąc pięćsetnego, bez murów obronnych, i ten plan skopiowano potem w setkach miast Ameryki Łacińskiej. Dlatego UNESCO wpisało je na listę światowego dziedzictwa. Zostawcie auto na parkingu przy starówce i idźcie pieszo: kolorowe fasady, drewniane balkony i ukryte patia za wielkimi bramami. Jeśli brama kamienicy jest otwarta, można dyskretnie zajrzeć na dziedziniec, to tu bije serce tych domów."},
{id:"carmen",t:"Cruz del Carmen",s:"las wawrzynowy i taras nad chmurami",lat:28.5303329,lon:-16.2804559,r:600,
 x:"Jesteście na grzbiecie Anagi, dziewięćset dwadzieścia metrów nad oceanem. Mirador Cruz del Carmen to brama do lasu wawrzynowego, laurisilvy. To żywa skamielina: takie puszcze porastały Europę dwadzieścia milionów lat temu, zanim wybiły je epoki lodowcowe. Tutaj przetrwały, bo pasat codziennie przynosi mgłę, którą drzewa dosłownie wyczesują z powietrza. Tuż przy parkingu zaczyna się Ścieżka Zmysłów, Sendero de los Sentidos: krótka, łatwa pętla wśród omszałych pni. Idźcie powoli i posłuchajcie, jak las kapie, nawet gdy nie pada. Z tarasu przy dobrej pogodzie widać Teide ponad morzem chmur."},
{id:"ingles",t:"Pico del Inglés",s:"balkon nad dwoma wybrzeżami",lat:28.5330072,lon:-16.2639969,r:450,
 x:"Pico del Inglés, prawie tysiąc metrów. To najlepszy balkon całej Anagi: w jedną stronę spadają zielone grzbiety aż po wioski na klifach północy, w drugą widać Santa Cruz, port i przy czystym powietrzu nawet Gran Canarię na horyzoncie. Nazwa, szczyt Anglika, ma pochodzić od brytyjskiego oficera, którego trzymano tu na widoku, gdy Anglicy szturmowali Santa Cruz. Parking jest mały i kręci się szybko, więc jak stoi kilka aut, chwilę cierpliwości. Dalej droga zacznie schodzić serpentynami na północną stronę: zamknijcie okna, jeśli wjedziecie w chmurę, i delikatnie z hamulcami."},
{id:"taganana",t:"Taganana",s:"wioska na końcu serpentyn",lat:28.5605853,lon:-16.2181647,r:800,
 x:"Zjeżdżacie do Taganany, jednej z najstarszych wiosek wyspy, założonej ledwie kilka lat po podboju. Przez wieki nie było tu drogi, tylko ścieżki przez góry, więc życie toczyło się własnym rytmem: winnice na tarasach, kozy i ocean. Białe domki wyglądają, jakby ktoś rozsypał je po zboczu. Spójrzcie w dół na skały w morzu: to Roques de Anaga, ostańce starego wulkanu, dziś rezerwat ptaków. Jeszcze kilka zakrętów i będziecie na wybrzeżu."},
{id:"africa",t:"Casa África · Roque de las Bodegas",s:"obiad nad oceanem, kuchnia do 17:00",lat:28.5694445,lon:-16.2043109,r:450,
 x:"Roque de las Bodegas, a w niej Casa África: knajpa, do której zjeżdża się zza gór. Bez fajerwerków, za to ryby prosto z łodzi. Spróbujcie smażonej ośmiornicy, to ich specjalność, do tego kanaryjskie ziemniaki papas arrugadas z sosami mojo: zielony z kolendry, czerwony z papryki. Uwaga logistyczna: kuchnia działa do siedemnastej, więc jesteście we właściwym miejscu o właściwej porze. Po obiedzie zostaje już tylko pięć minut jazdy na plażę Benijo."},
{id:"benijo",t:"Playa de Benijo",s:"czarny piasek i roques na finał",lat:28.5721077,lon:-16.1925214,r:500,
 x:"Finał dnia: Playa de Benijo. Auto zostaje na górze przy drodze, w dół schodzi się schodami między domkami, kilka minut. Czarny wulkaniczny piasek, dziko, bez leżaków, a z wody wyrastają iglice Roques de Anaga. To jedno z najczęściej fotografowanych miejsc wyspy. Ocean jest tu potężny: fale i prądy bywają silne, więc kąpiel tylko przy spokojnej wodzie i płytko, a najlepiej po prostu pomoczyć nogi. Usiądźcie na piasku i popatrzcie, jak światło robi się coraz cieplejsze. Stąd macie już tylko drogę powrotną: te same serpentyny, potem autostrada na południe. To był piękny dzień."}
];

const $=id=>document.getElementById(id);
const played={}, queued={};
let cur=null, sents=[], si=0, speaking=false, paused=false, wl=null;

/* ---------- UI ---------- */
const box=$("stops");
STOPS.forEach((st,i)=>{
  const d=document.createElement("div");
  d.className="card stop"; d.id="c_"+st.id;
  d.innerHTML=`<div class="top"><div><h2>${i===0?"⏵":i+"."} ${st.t}</h2>
    <div class="sub">${st.s}</div></div><div class="dist" id="d_${st.id}"></div></div>
    <div class="state" id="s_${st.id}"></div>
    <div class="mini"><button onclick="playStop('${st.id}',true)">▶</button>
    <button onclick="restart('${st.id}')">↺</button></div>`;
  box.appendChild(d);
});
function setState(id,cls,txt){const e=$("s_"+id);e.className="state "+(cls||"");e.textContent=txt||"";}
function markCard(){STOPS.forEach(s=>{const c=$("c_"+s.id);
  c.classList.toggle("playing",cur===s.id);
  c.classList.toggle("done",!!played[s.id]&&cur!==s.id);});}

/* ---------- TTS (zdanie po zdaniu — stabilne na Androidzie) ---------- */
function plVoice(){const v=speechSynthesis.getVoices();
  return v.find(x=>/^pl/i.test(x.lang))||v.find(x=>/pol/i.test(x.name))||null;}
function speakNext(){
  if(paused||cur===null)return;
  if(si>=sents.length){ // koniec przystanku
    played[cur]=true; setState(cur,"done","✓ odsłuchane"); const fin=cur;
    cur=null; markCard();
    const nq=STOPS.find(s=>queued[s.id]); if(nq){delete queued[nq.id]; playStop(nq.id);}
    return;
  }
  const u=new SpeechSynthesisUtterance(sents[si]);
  const v=plVoice(); if(v)u.voice=v; u.lang="pl-PL"; u.rate=.97;
  u.onend=()=>{if(!paused){si++;speakNext();}};
  u.onerror=()=>{if(!paused){si++;speakNext();}};
  speechSynthesis.resume(); speechSynthesis.speak(u);
}
function playStop(id,user){
  const st=STOPS.find(s=>s.id===id); if(!st)return;
  if(cur&&cur!==id&&!user){ if(!played[id]){queued[id]=true;setState(id,"q","w kolejce…");} return;}
  speechSynthesis.cancel();
  cur=id; sents=st.x.match(/[^.!?…]+[.!?…]+["']?|\S[^.!?…]*$/g)||[st.x];
  si=0; paused=false; $("pauseBtn").textContent="⏸ Pauza";
  setState(id,"play","▶ teraz gra"); markCard();
  $("c_"+id).scrollIntoView({behavior:"smooth",block:"center"});
  speakNext();
}
function restart(id){playStop(id,true);}
$("pauseBtn").onclick=()=>{
  if(!cur)return;
  if(!paused){paused=true;speechSynthesis.cancel();$("pauseBtn").textContent="⏵ Wznów";setState(cur,"q","⏸ pauza");}
  else{paused=false;$("pauseBtn").textContent="⏸ Pauza";setState(cur,"play","▶ teraz gra");speakNext();}
};
$("replayBtn").onclick=()=>{const id=cur||lastPlayed(); if(id)playStop(id,true);};
$("stopBtn").onclick=()=>{speechSynthesis.cancel();if(cur)setState(cur,"","");cur=null;paused=false;
  $("pauseBtn").textContent="⏸ Pauza";markCard();};
function lastPlayed(){let l=null;STOPS.forEach(s=>{if(played[s.id])l=s.id;});return l;}

/* ---------- pilot ---------- */
$("pilotChk").onchange=e=>{$("nextBtn").style.display=e.target.checked?"block":"none";};
$("nextBtn").onclick=()=>{const n=STOPS.find(s=>!played[s.id]); if(n)playStop(n.id,true);};

/* ---------- GPS ---------- */
function hav(a,b,c,d){const R=6371e3,p=Math.PI/180,
  dA=(c-a)*p,dB=(d-b)*p,
  h=Math.sin(dA/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(dB/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));}
function fmt(m){return m<950?Math.round(m/10)*10+" m":(m/1000).toFixed(1).replace(".",",")+" km";}
function onPos(p){
  const{latitude:la,longitude:lo,accuracy:ac}=p.coords;
  $("gpsDot").className="dot on";
  $("gpsTxt").innerHTML=`GPS aktywny <small>±${Math.round(ac)} m</small>`;
  let nearId=null,nearD=1e12;
  STOPS.forEach(s=>{
    if(s.lat===null)return;
    const d=hav(la,lo,s.lat,s.lon);
    $("d_"+s.id).textContent=fmt(d);
    if(!played[s.id]&&d<nearD){nearD=d;nearId=s.id;}
    if(d<=s.r&&!played[s.id]&&!queued[s.id]&&cur!==s.id)playStop(s.id);
  });
  STOPS.forEach(s=>$("c_"+s.id).classList.toggle("near",s.id===nearId&&cur!==s.id));
}
function onErr(e){
  $("gpsDot").className="dot err";
  $("gpsTxt").textContent = e.code===1
    ? "Brak zgody na lokalizację — dotknij kłódki obok adresu → Uprawnienia → Lokalizacja → Zezwól, potem odśwież"
    : "Szukam sygnału GPS…";
}
async function lock(){try{wl=await navigator.wakeLock.request("screen");}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")lock();});

/* ---------- start ---------- */
$("startBtn").onclick=()=>{
  $("overlay").style.display="none";
  speechSynthesis.getVoices();
  if(!window.isSecureContext){
    $("warn").style.display="block";
    $("warn").textContent="Ta kopia działa poza https — Chrome blokuje tu GPS. Otwórz wersję online, a wszystko zadziała samo.";
  }else if(navigator.geolocation){
    $("gpsTxt").textContent="GPS: pytam o zgodę…";
    navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:3000,timeout:15000});
  }
  lock();
  playStop("intro",true);
};
</script>
</body>
</html>
